# Gets the Opening/Ending of today and tomorrow (UTC+7) ready ahead of time: creates those days' puzzles,
# copies their songs to R2 (re-encoded, ~1 MB each) and makes any missing clue clip (pipeline step `daily`),
# so players stream from Cloudflare instead of waiting on AnimeThemes. Uses the same secrets as pipeline.yml.
# GitHub may start scheduled runs late or skip one when busy: preparing a day ahead, twice a day, leaves
# plenty of slack. A run with nothing to do finishes in seconds.
name: daily

on:
  schedule:
    # 05:20 and 17:20 UTC = 12:20 and 00:20 UTC+7, off the busy top of the hour.
    - cron: '20 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # Usually a few minutes; slow AnimeThemes downloads (up to 5 min per song, see stepDaily) need the headroom.
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
      POOL_USERS: ${{ secrets.POOL_USERS }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MEDIA_BASE_URL: https://media.velvetaco.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run pipeline -- daily
